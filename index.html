<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descubrimiento · Tienda UCJC</title>
  <!-- La demo se monta como la tienda: fuentes, tokens y funciones comunes del shell (presentacion-campus@1). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cesar-andress.github.io/tienda-ucjc-shell/comun/campus.css">
  <script src="https://cesar-andress.github.io/tienda-ucjc-shell/comun/campus.js"></script>
  <style>
    body { margin: 0; background: var(--ucjc-fog); padding: clamp(8px, 2vw, 24px); font-family: var(--ucjc-font-sans); }
    .log { max-width: 1280px; margin: 16px auto 0; padding: 14px 16px; border-radius: var(--ucjc-radius); background: var(--ucjc-ink); color: var(--ucjc-panel); font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    ucjc-descubrimiento { max-width: 1280px; margin: 0 auto; }
  </style>
</head>
<body>
  <ucjc-descubrimiento></ucjc-descubrimiento>
  <div class="log" id="log">Bus: aquí aparecen los eventos ucjc:descubrimiento:anadir-al-carrito@1 que emite la pieza.</div>
  <script type="module">
    import './src/main.js';
    const log = document.getElementById('log');
    ['ucjc:descubrimiento:anadir-al-carrito@1', 'ucjc:descubrimiento:campana-cambiada@1'].forEach((n) =>
      window.addEventListener(n, (e) => { log.textContent = n + '\n' + JSON.stringify(e.detail, null, 2); }));
  </script>
</body>
</html>
